[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "print-parts-catalog"
version = "0.1.0"
description = "Catalog of parametric 3D-printable parts built with CadQuery and marimo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
	"cadquery",
]

[dependency-groups]
dev = [
	"marimo",
	"plotly",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
